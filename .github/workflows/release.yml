name: Release APK

# Builds a SIGNED release APK ready to sideload (or convert to AAB for Play).
#
# Requirements — add these repository secrets (see SECURITY.md for why the
# keystore must never be committed):
#   RELEASE_KEYSTORE_BASE64  — the upload keystore, base64-encoded
#   RELEASE_STORE_PASSWORD   — keystore password
#   RELEASE_KEY_PASSWORD     — key password
#   RELEASE_KEY_ALIAS        — normally "upload"
#
# Create the keystore locally once, then base64 it:
#   keytool -genkeypair -v -keystore my-upload-key.jks -storetype PKCS12 \
#     -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
#     -dname "CN=CalcQuick, O=rodri2482, C=US"
#   powershell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("my-upload-key.jks")) > base64.txt
#   linux/mac:   base64 -w0 my-upload-key.jks
# BACK UP this keystore — losing it means losing the ability to update the app.

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
          chmod 600 my-upload-key.jks

      - name: Build signed release APK (R8 minified)
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      # expose KEY_ALIAS as environment var also read by build.gradle.kts
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcQuick-release-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
